services:
  vqa-api:
    build: .
    image: vqa-api:local
    ports:
      - "8000:8000"
    environment:
      - VQA_ARTIFACTS_DIR=/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
